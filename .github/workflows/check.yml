# Catches the writing-rule slips a script can see: em dashes in pages and examples.

name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: No em dashes
        run: |
          if grep -rnI --include='*.mdx' --include='*.md' --include='*.py' --include='*.ts' --include='*.sh' --include='*.yaml' -e $'\xe2\x80\x94' src examples openapi.yaml README.md CONTRIBUTING.md; then
            echo "Em dash found. Use commas, colons, parentheses or separate sentences."
            exit 1
          fi
